<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storefront</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: #f8f9fa; color: #212529; }
    header { background: #ffffff; padding: 20px; text-align: center; border-bottom: 1px solid #e9ecef; }
    .logo { max-height: 70px; margin-bottom: 10px; }
    .slogan { color: #6c757d; font-size: 14px; margin-top: 4px; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .categories-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; }
    .cat-chip { padding: 6px 14px; background: #e9ecef; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 14px; font-weight: 500; }
    .cat-chip.active { background: #007bff; color: white; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
    .card h3 { margin: 12px 0 6px; font-size: 16px; }
    .price-select { margin: 8px 0; width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ced4da; }
    .btn-buy { background: #25D366; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px; }
    .btn-buy:disabled { background: #adb5bd; cursor: not-allowed; }
  </style>
  <script src="app.js?v=300" defer></script>
</head>
<body>
  <header>
    <img id="store-logo" class="logo" style="display:none;" alt="Store Logo">
    <h1 id="store-title" style="margin:0;">Loading Store...</h1>
    <p id="store-slogan" class="slogan"></p>
  </header>

  <div class="container">
    <div id="categories-bar" class="categories-bar"></div>
    <div id="catalog-grid" class="grid"></div>
  </div>
</body>
</html>
