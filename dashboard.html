<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Control Center | Store Engine</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #10b981;
      --danger: #ef4444;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 12px 60px;
      display: flex;
      justify-content: center;
    }

    .dashboard-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .header-card h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header-card p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .section-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    /* Product Row Items */
    .product-row-item {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .item-media-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .row-preview-img {
      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 6px;
      background-color: #e2e8f0;
    }

    .upload-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .upload-btn-wrapper .btn {
      padding: 4px 8px;
      font-size: 11px;
      background-color: #e2e8f0;
      color: #334155;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    .upload-btn-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }

    .form-group-item label {
      font-size: 11px;
      color: var(--text-muted);
      display: block;
      margin-bottom: 2px;
    }

    .form-group-item input {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .btn {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      width: 100%;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
    }

    .btn-danger {
      background-color: #fee2e2;
      color: var(--danger);
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .link-box {
      margin-top: 16px;
      padding: 12px;
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      display: none;
    }

    .link-box a {
      color: #047857;
      font-weight: 600;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <!-- Header -->
    <div class="header-card">
      <h1>Merchant Control Center</h1>
      <p>Manage your product catalog, image assets, and live storefront configuration.</p>
    </div>

    <!-- Store Setup -->
    <div class="section-card">
      <div class="section-title">
        <span>Store Details</span>
      </div>

      <!-- Store Handle ID + Fetch Cloud Button -->
      <div class="form-group">
        <label for="store-id">Store Handle / ID</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="store-id" placeholder="e.g. my-awesome-store" style="flex: 1;">
          <button type="button" id="fetch-cloud-btn" class="btn" style="background-color: #0284c7; color: white; border: none; padding: 0 14px; font-size: 13px; font-weight: 600; white-space: nowrap; border-radius: 8px; cursor: pointer;">
            🔄 Fetch from Cloud
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="phone">WhatsApp Phone Number (with Country Code)</label>
        <input type="text" id="phone" placeholder="e.g. 254712345678">
      </div>
    </div>

    <!-- Inventory Section -->
    <div class="section-card">
      <div class="section-title">
        <span>Product Catalog</span>
        <button id="add-item-btn" class="btn btn-secondary" style="font-size: 12px; padding: 6px 12px;">+ Add New Item</button>
      </div>

      <div id="inventory-container">
        <!-- Dynamic Product Items Rendered Here -->
      </div>
    </div>

    <!-- Publishing Actions -->
    <div class="section-card">
      <button id="generate-btn" class="btn btn-primary" style="padding: 14px; font-size: 15px;">
        🚀 Publish Changes to Live Cloud
      </button>

      <div id="link-box" class="link-box">
        <p style="font-size: 12px; color: #065f46; margin-bottom: 4px; font-weight: 600;">Your Live Storefront Link:</p>
        <a id="store-url" href="#" target="_blank"></a>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
