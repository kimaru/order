<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Dashboard - EcoEngine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; padding: 20px; max-width: 800px; margin: 0 auto; }
    
    .card { background: white; padding: 24px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 24px; shadow: 0 1px 3px rgba(0,0,0,0.05); }
    h1 { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
    p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 20px; }
    
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input[type="text"], input[type="tel"], input[type="number"], select {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s;
    }
    input:focus, select:focus { border-color: #10b981; }
    
    .color-options { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
    .color-picker-wrapper { display: flex; align-items: center; gap: 10px; }
    input[type="color"] { border: none; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; background: transparent; }

    .btn { background: #10b981; color: white; border: none; padding: 10px 18px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #0f172a; }
    .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #334155; }

    .product-row { display: grid; grid-template-columns: 60px 1fr 100px 40px; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
    .product-row img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; background: #f1f5f9; }
    .del-btn { color: #ef4444; border: none; background: transparent; font-size: 18px; cursor: pointer; }
    
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .status-bar { padding: 10px 14px; border-radius: 8px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; font-size: 13px; font-weight: 500; margin-bottom: 20px; display: none; }
  </style>
</head>
<body>

  <div class="flex-between" style="margin-bottom: 20px;">
    <div>
      <h1>Merchant Dashboard</h1>
      <p class="subtitle">Manage your store details, branding, and product catalog.</p>
    </div>
    <button id="fetch-cloud-btn" class="btn btn-outline">🔄 Fetch from Cloud</button>
  </div>

  <div id="status-msg" class="status-bar"></div>

  <!-- Store Settings & Branding Card -->
  <div class="card">
    <h2>🎨 Store Settings & Custom Branding</h2>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div class="form-group">
        <label for="store-id-input">Store ID (URL Parameter)</label>
        <input type="text" id="store-id-input" placeholder="e.g. aromatic-vibes">
      </div>
      <div class="form-group">
        <label for="store-phone-input">WhatsApp Phone Number</label>
        <input type="tel" id="store-phone-input" placeholder="e.g. +254712345678">
      </div>
    </div>

    <div class="form-group">
      <label for="store-slogan-input">Store Slogan / Subtitle</label>
      <input type="text" id="store-slogan-input" placeholder="e.g. Luxury Handcrafted Fragrances & Oils">
    </div>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px;">
      <div class="form-group">
        <label for="store-logo-input">Store Logo URL</label>
        <input type="text" id="store-logo-input" placeholder="https://... image link">
      </div>
      <div class="form-group">
        <label for="store-theme-color">Theme Accent Color</label>
        <div class="color-picker-wrapper">
          <input type="color" id="store-theme-color" value="#10b981">
          <span id="color-hex-label" style="font-size: 13px; font-weight: 600; color: #64748b;">#10b981</span>
        </div>
      </div>
    </div>

    <button id="save-settings-btn" class="btn btn-secondary" style="margin-top: 8px;">💾 Save Store Settings</button>
  </div>

  <!-- Add Product Card -->
  <div class="card">
    <h2>➕ Add New Product</h2>
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px;">
      <div class="form-group">
        <label for="prod-name">Product Name</label>
        <input type="text" id="prod-name" placeholder="e.g. Vanilla Oud Extrait 50ml">
      </div>
      <div class="form-group">
        <label for="prod-price">Price (KSh)</label>
        <input type="number" id="prod-price" placeholder="e.g. 3500">
      </div>
    </div>
    <div class="form-group">
      <label for="prod-img">Product Image URL</label>
      <input type="text" id="prod-img" placeholder="https://...">
    </div>
    <button id="add-prod-btn" class="btn">+ Add Product to List</button>
  </div>

  <!-- Product Catalog List -->
  <div class="card">
    <div class="flex-between" style="margin-bottom: 16px;">
      <h2>📦 Product Catalog (<span id="prod-count">0</span>)</h2>
      <button id="sync-cloud-btn" class="btn">🚀 Publish All Changes to Storefront</button>
    </div>
    <div id="product-list-container">
      <!-- Dynamic Products Go Here -->
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
